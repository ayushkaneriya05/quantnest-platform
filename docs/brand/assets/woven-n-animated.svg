<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 72" role="img" aria-label="QuantNest Woven N logo" class="motion" style="color:#121820"><title>QuantNest Woven N logo</title><style>
    .motion .piece,.motion .lettering{transform-box:fill-box;transform-origin:center;animation:qn-enter 640ms cubic-bezier(.2,.8,.2,1) both}
    .motion .piece-two{animation-name:qn-return;animation-delay:100ms}.motion .piece-three{animation-name:qn-core;animation-delay:220ms}
    .motion .lettering{animation-delay:230ms;animation-duration:540ms}
    .motion .counter{animation:qn-cut 540ms ease-out 140ms both}
    .motion .current-trace{stroke-dasharray:1;animation:qn-draw 780ms cubic-bezier(.35,0,.2,1) both}
    .motion .union-band{animation:qn-union 720ms cubic-bezier(.2,.8,.2,1) both}
    .motion .signature-letters{animation:qn-enter 540ms ease-out both}
    .motion .core-ribbon{animation:qn-weave 720ms cubic-bezier(.2,.8,.2,1) both}
    .motion .core-ribbon-0{--weave-x:-4px;--weave-y:4px}
    .motion .core-ribbon-1{--weave-x:4px;--weave-y:-4px;animation-delay:80ms}
    @keyframes qn-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes qn-return{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes qn-core{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
    @keyframes qn-cut{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @keyframes qn-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes qn-union{from{opacity:0;transform:translate(-5px,-5px)}to{opacity:1;transform:translate(0,0)}}
    @keyframes qn-weave{from{opacity:0;transform:translate(var(--weave-x),var(--weave-y))}to{opacity:1;transform:translate(0,0)}}
    @media(prefers-reduced-motion:reduce){.motion .piece,.motion .lettering,.motion .counter,.motion .current-trace,.motion .union-band,.motion .signature-letters,.motion .core-ribbon{animation:none!important}}
  </style><g transform="translate(0 4)" fill="currentColor"><defs><clipPath id="quantnest-left"><path d="M0 0H64V4L0 47Z"/></clipPath><clipPath id="quantnest-right"><path d="M0 47L64 4V68H0Z"/></clipPath></defs><g class="piece piece-one" clip-path="url(#quantnest-left)"><path fill-rule="evenodd" d="M6 59V5H21L44 43V5H58V59H43L20 21V59ZM25.4474 30L33.1053 25L34.9211 28L27.2632 33ZM38.2 51L47 45L49 48L40 54Z"/></g><g class="piece piece-two" clip-path="url(#quantnest-right)"><path fill-rule="evenodd" d="M6 59V5H21L44 43V5H58V59H43L20 21V59ZM25.4474 30L33.1053 25L34.9211 28L27.2632 33ZM38.2 51L47 45L49 48L40 54Z"/></g></g><g transform="translate(78 4)"><g class="lettering"><g fill="none" stroke="currentColor" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"><path d="M34.5 26V38C34.5 48 29 54 20.25 54S6 48 6 38V26C6 16 11.5 10 20.25 10S34.5 16 34.5 26ZM23.25 42L37.5 57"/><path d="M45.75 26V43C45.75 50 49.5 54 54.75 54S64.5 50 64.5 42V26M64.5 26V54"/><path d="M92.25 40C92.25 48 88.5 54 83.25 54S73.5 48 73.5 40S77.25 26 83.25 26S92.25 32 92.25 40ZM92.25 27V54"/><path d="M102.75 54V27M102.75 39C102.75 31 106.5 26 111.75 26S122.25 32 122.25 40V54"/><path d="M135 15V45Q135 54 141.75 54H145.5M129.75 27H144.75"/><path d="M156 54V11L180 54V11"/><path d="M209.5 48C205.5 54 197.25 56 192.75 50C186.75 42 189.75 28 197.25 26C204.75 24 210.75 30 210.75 40H190.5"/><path d="M239.25 30C234 24 222.75 25 222.75 34C222.75 43 240 38 240 47C240 56 228 56 222 50"/><path d="M255 15V45Q255 54 261.75 54H265.5M249.75 27H264.75"/></g></g></g></svg>