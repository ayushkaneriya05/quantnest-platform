# Financial handoff and lifecycle projections: persistent, never evicted.
bind 0.0.0.0
protected-mode yes
port 6379
appendonly yes
appendfsync always
maxmemory-policy noeviction
maxmemory 320mb
# Container limit is 768 MiB; reserve headroom for snapshots/AOF rewrite and allocator overhead.
save 900 1
tcp-keepalive 60
# Docker-only listener. Compose supplies requirepass and an isolated data network.
