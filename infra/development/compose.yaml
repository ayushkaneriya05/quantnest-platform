name: quantnest-development

x-backend: &backend
  build: {context: ../.., dockerfile: infra/shared/docker/backend.Dockerfile}
  image: quantnest-backend:development
  env_file: [backend.env]
  environment:
    QUANTNEST_DEPLOYMENT_MODE: development
    DEBUG: "True"
    EXECUTION_ENABLED_SCOPES: "${EXECUTION_ENABLED_SCOPES:-paper}"
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    CACHE_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
    MARKET_CACHE_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
    RESEARCH_CACHE_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis-cache:6379/0
    RUNTIME_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/3
    RESEARCH_SERVICE_URL: http://research:8001
    QUANTNEST_RUNTIME_DIR: /var/lib/quantnest/runtime
  volumes: [runtime:/var/lib/quantnest/runtime, media:/opt/quantnest/backend/media, staticfiles:/opt/quantnest/backend/staticfiles]
  networks: [private, outbound]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    redis-cache: {condition: service_healthy}
  init: true
  restart: unless-stopped
  stop_grace_period: 90s
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

services:
  postgres:
    image: timescale/timescaledb:2.30.2-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
    environment: {POSTGRES_DB: "${DB_NAME:?Set DB_NAME}", POSTGRES_USER: quantnest_admin, POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}", DB_USER: "${DB_USER:?Set DB_USER}", DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}", TIMESCALEDB_TELEMETRY: "off"}
    ports: ["127.0.0.1:54329:5432"]
    volumes: [postgres:/var/lib/postgresql/data, ../shared/postgres/010-initialize.sh:/docker-entrypoint-initdb.d/010-initialize.sh:ro]
    networks: [private]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: redis:7.4.6-bookworm
    environment: {REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"}
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 512mb, --maxmemory-policy, noeviction, --requirepass, "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes: [redis:/data]
    networks: [private]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 10s, timeout: 3s, retries: 5}
    mem_limit: 768m
  redis-cache:
    image: redis:7.4.6-bookworm
    environment: {REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"}
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru, --requirepass, "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    networks: [private]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 10s, timeout: 3s, retries: 5}
    mem_limit: 192m
  api:
    <<: *backend
    command: [uvicorn, backend.asgi:application, --host, 0.0.0.0, --port, "8000", --no-proxy-headers]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os; from urllib.request import ProxyHandler, Request, build_opener;
          build_opener(ProxyHandler({})).open(Request("http://127.0.0.1:8000/health/",
          headers={"X-Forwarded-Proto": "https", "X-QuantNest-Proxy-Token": os.environ.get("QUANTNEST_PROXY_TOKEN", "")}), timeout=5).close()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  feed:
    <<: *backend
    command: [python, -m, quantnest_runtime, market-data]
    profiles: [market-data]
  execution:
    <<: *backend
    command: [python, -m, execution]
  broker-events:
    <<: *backend
    command: [python, -m, quantnest_runtime, broker-events]
    profiles: [live]
  background:
    <<: *backend
    command: [celery, -A, backend, worker, --queues=default,live,marketdata, --concurrency=2, --max-tasks-per-child=100, --hostname=background@%h]
  compute:
    <<: *backend
    command: [celery, -A, backend, worker, --queues=compute, --concurrency=1, --max-tasks-per-child=25, --max-memory-per-child=1000000, --hostname=compute@%h]
  beat:
    <<: *backend
    command: [celery, -A, backend, beat, --schedule=/var/lib/quantnest/scheduler/celerybeat]
    volumes: [scheduler:/var/lib/quantnest/scheduler]
  research:
    build: {context: ../.., dockerfile: infra/shared/docker/research.Dockerfile}
    image: quantnest-research:development
    env_file: [research.env]
    environment: {RESEARCH_INTERNAL_API_URL: "http://api:8000/api/v1/research/tools/"}
    networks: [private, outbound]
    profiles: [research]
    restart: unless-stopped
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).close()"], interval: 30s, timeout: 5s, retries: 3, start_period: 30s}
    init: true
  frontend:
    image: node:22.14.0-bookworm-slim
    working_dir: /workspace
    command: [sh, -c, "npm ci && npm run dev -- --host 0.0.0.0"]
    env_file: [frontend.env]
    environment:
      QUANTNEST_API_PROXY_TARGET: http://api:8000
    volumes:
      - ../../frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    ports: ["127.0.0.1:5173:5173"]
    networks: [outbound]
    depends_on: [api]
    init: true

networks:
  private: {internal: true}
  outbound: {}

volumes:
  postgres: {}
  redis: {}
  runtime: {}
  media: {}
  staticfiles: {}
  scheduler: {}
  frontend-node-modules: {}
