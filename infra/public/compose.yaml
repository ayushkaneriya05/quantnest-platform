name: quantnest-public

x-backend: &backend
  build: {context: ../.., dockerfile: infra/shared/docker/backend.Dockerfile}
  image: quantnest-backend:${QUANTNEST_RELEASE:-local}
  env_file: [backend.env]
  environment: &backend-env
    QUANTNEST_DEPLOYMENT_MODE: public
    DEBUG: "False"
    EXECUTION_ENABLED_SCOPES: paper
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    CACHE_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
    MARKET_CACHE_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
    RESEARCH_CACHE_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis-cache:6379/0
    RUNTIME_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis-runtime:6379/0
    RESEARCH_SERVICE_URL: http://research:8001
    QUANTNEST_RUNTIME_DIR: /var/lib/quantnest/runtime
    EXECUTION_NOTIFY_TARGETS: 172.29.0.10
  volumes: [runtime:/var/lib/quantnest/runtime, media:/opt/quantnest/backend/media, staticfiles:/opt/quantnest/backend/staticfiles]
  networks: [private, outbound]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    redis-runtime: {condition: service_healthy}
    redis-cache: {condition: service_healthy}
  restart: unless-stopped
  init: true
  stop_grace_period: 90s
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

services:
  postgres:
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    image: timescale/timescaledb:2.30.2-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
    environment: {POSTGRES_DB: "${DB_NAME:?Set DB_NAME}", POSTGRES_USER: quantnest_admin, POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}", DB_USER: "${DB_USER:?Set DB_USER}", DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}", TIMESCALEDB_TELEMETRY: "off", TS_TUNE_MEMORY: "1536MB", TS_TUNE_NUM_CPUS: "2"}
    volumes: [postgres:/var/lib/postgresql/data, ../shared/postgres/010-initialize.sh:/docker-entrypoint-initdb.d/010-initialize.sh:ro]
    networks: [private]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
    mem_limit: 1536m
  redis:
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    image: redis:7.4.6-bookworm
    environment: {REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"}
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction, --requirepass, "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes: [redis:/data]
    networks: [private]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 10s, timeout: 3s, retries: 5}
    restart: unless-stopped
    mem_limit: 384m
  redis-runtime:
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    image: redis:7.4.6-bookworm
    environment: {REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"}
    command: [redis-server, /usr/local/etc/redis/redis.conf, --requirepass, "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes: [redis-runtime:/data, ../shared/redis/runtime.conf:/usr/local/etc/redis/redis.conf:ro]
    networks: [private]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 10s, timeout: 3s, retries: 5}
    restart: unless-stopped
    mem_limit: 768m
  redis-cache:
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    image: redis:7.4.6-bookworm
    environment: {REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"}
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru, --requirepass, "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    networks: [private]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 10s, timeout: 3s, retries: 5}
    restart: unless-stopped
    mem_limit: 192m
  api:
    <<: *backend
    networks: [private, outbound, edge]
    command: [uvicorn, backend.asgi:application, --host, 0.0.0.0, --port, "8000", --workers, "${API_WORKERS:-1}", --no-server-header, --no-proxy-headers, --no-access-log]
    mem_limit: 512m
    healthcheck: {test: [CMD, python, -m, quantnest_runtime.probe, --require-mode, public], interval: 30s, timeout: 10s, retries: 5, start_period: 60s}
  feed:
    <<: *backend
    command: [python, -m, quantnest_runtime, market-data]
    mem_limit: 768m
  execution:
    <<: *backend
    command: [python, -m, quantnest_runtime, execution]
    environment:
      <<: *backend-env
      EXECUTION_NOTIFY_BIND: 0.0.0.0
    networks:
      private: {ipv4_address: 172.29.0.10}
      outbound: {}
    mem_limit: 1536m
  orders:
    <<: *backend
    command: [python, -m, quantnest_runtime, orders]
    mem_limit: 512m
  terminal:
    <<: *backend
    command: [python, -m, quantnest_runtime, terminal]
    mem_limit: 384m
  outbox:
    <<: *backend
    command: [python, -m, quantnest_runtime, outbox]
    mem_limit: 384m
  background:
    <<: *backend
    command: [celery, -A, backend, worker, --queues=default,paper,marketdata,notifications, --concurrency=1, --prefetch-multiplier=1, --max-tasks-per-child=100, --hostname=background@%h]
    mem_limit: 768m
  compute:
    <<: *backend
    command: [celery, -A, backend, worker, --queues=compute, --concurrency=1, --prefetch-multiplier=1, --max-tasks-per-child=25, --max-memory-per-child=850000, --hostname=compute@%h]
    mem_limit: 1280m
    cpus: 0.75
  beat:
    <<: *backend
    command: [celery, -A, backend, beat, --schedule=/var/lib/quantnest/scheduler/celerybeat]
    volumes: [scheduler:/var/lib/quantnest/scheduler]
    mem_limit: 192m
  research:
    build: {context: ../.., dockerfile: infra/shared/docker/research.Dockerfile}
    image: quantnest-research:${QUANTNEST_RELEASE:-local}
    env_file: [research.env]
    environment: {RESEARCH_INTERNAL_API_URL: "http://api:8000/api/v1/research/tools/"}
    networks: [private, outbound]
    restart: unless-stopped
    mem_limit: 384m
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).close()"], interval: 30s, timeout: 5s, retries: 3, start_period: 30s}
    init: true
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  ingress:
    image: caddy:2.10.2
    environment:
      PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}"
      ORIGIN_HOSTNAME: "${ORIGIN_HOSTNAME:?Set ORIGIN_HOSTNAME}"
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, ./tls:/etc/caddy/tls:ro, caddy:/data, caddy-config:/config]
    ports: ["443:443"]
    networks: [edge, outbound]
    depends_on: [api]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    mem_limit: 128m

networks:
  private: {internal: true, ipam: {config: [{subnet: 172.29.0.0/24}]}}
  edge: {internal: true}
  outbound: {}

volumes:
  staticfiles: {}
  postgres: {}
  redis: {}
  redis-runtime: {}
  runtime: {}
  media: {}
  scheduler: {}
  caddy: {}
  caddy-config: {}
