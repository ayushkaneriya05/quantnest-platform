name: Verify release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: timescale/timescaledb:2.30.2-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
        env: {POSTGRES_DB: quantnest_ci, POSTGRES_USER: quantnest_ci, POSTGRES_PASSWORD: isolated-ci-password, TIMESCALEDB_TELEMETRY: 'off'}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quantnest_ci -d quantnest_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'False'
      SECRET_KEY: isolated-ci-signing-key-with-at-least-fifty-characters-for-checks
      DB_NAME: quantnest_ci
      DB_USER: quantnest_ci
      DB_PASSWORD: isolated-ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      QUANTNEST_DEPLOYMENT_MODE: development
      NUMBA_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: pip install --require-hashes -r research_service/requirements.lock
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.14.0', cache: npm, cache-dependency-path: 'frontend/package-lock.json'}
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/upload-artifact@v4
        with: {name: frontend, path: frontend/dist, retention-days: 7}
  images:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s infra/shared/scripts -p 'test_*.py'
      - run: docker build --platform linux/arm64 -f infra/shared/docker/backend.Dockerfile -t quantnest-backend:ci .
      - run: docker build --platform linux/arm64 -f infra/shared/docker/research.Dockerfile -t quantnest-research:ci .
      - run: docker build --platform linux/arm64 -f infra/shared/docker/frontend.Dockerfile --build-arg VITE_SITE_URL=https://private.example.com -t quantnest-frontend:ci .
      - run: |
          cp infra/development/backend.env.example infra/development/backend.env
          cp infra/development/research.env.example infra/development/research.env
          cp infra/development/frontend.env.example infra/development/frontend.env
          cp infra/public/backend.env.example infra/public/backend.env
          cp infra/public/research.env.example infra/public/research.env
          cp infra/private/backend.env.example infra/private/backend.env
          cp infra/private/research.env.example infra/private/research.env
      - run: docker compose --env-file infra/development/backend.env -f infra/development/compose.yaml config --quiet
      - run: docker compose --env-file infra/public/backend.env -f infra/public/compose.yaml config --quiet
      - run: docker compose --env-file infra/private/backend.env -f infra/private/compose.yaml config --quiet
      - run: docker run --rm -e DEBUG=False -e SECRET_KEY=isolated-ci-image-signing-key-with-at-least-fifty-characters -e QUANTNEST_DEPLOYMENT_MODE=development -e DB_NAME=quantnest -e DB_USER=quantnest -e DB_PASSWORD=configuration-check-only quantnest-backend:ci python manage.py check
